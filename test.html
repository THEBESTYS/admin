<!DOCTYPE html>
<html>
<head>
    <title>🔥 긴급 테스트 페이지</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; }
        .success { color: green; font-size: 24px; }
        .box { border: 2px solid #3b82f6; padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 500px; }
    </style>
</head>
<body>
    <div class="box">
        <h1 class="success">✅ GitHub Pages 작동 확인!</h1>
        <p>admin 레포지토리가 정상적으로 배포되었습니다.</p>
        
        <h3>📊 현재 상태</h3>
        <p><strong>레포지토리:</strong> admin</p>
        <p><strong>배포 주소:</strong> <span id="current-url"></span></p>
        <p><strong>로그인 페이지:</strong> <a href="https://yourname.github.io/login/" id="login-link">이동하기</a></p>
        
        <h3>🔧 다음 테스트</h3>
        <button onclick="testFirebase()">Firebase 연결 테스트</button>
        <div id="firebase-result" style="margin-top: 20px;"></div>
    </div>
    
    <script>
        // 현재 URL 표시
        document.getElementById('current-url').textContent = window.location.href;
        
        // 로그인 링크 업데이트
        const username = window.location.hostname.split('.')[0];
        document.getElementById('login-link').href = `https://${username}.github.io/login/`;
        
        // Firebase 테스트 함수
        async function testFirebase() {
            const resultDiv = document.getElementById('firebase-result');
            resultDiv.innerHTML = '<p>Firebase 연결 시도 중...</p>';
            
            try {
                // Firebase SDK 동적 로드
                const script = document.createElement('script');
                script.src = "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js";
                script.onload = () => {
                    const authScript = document.createElement('script');
                    authScript.src = "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js";
                    authScript.onload = () => {
                        testFirebaseConnection();
                    };
                    document.head.appendChild(authScript);
                };
                document.head.appendChild(script);
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:red">❌ 스크립트 로드 실패: ${error.message}</p>`;
            }
        }
        
        function testFirebaseConnection() {
            const config = {
                apiKey: "AIzaSyC1XDqgki7lKMz-EE4ZFzOLmku8EsLI0yI",
                authDomain: "login-57c14.firebaseapp.com",
                projectId: "login-57c14"
            };
            
            try {
                const app = firebase.initializeApp(config);
                const auth = firebase.auth();
                
                document.getElementById('firebase-result').innerHTML = `
                    <p style="color:green">✅ Firebase 초기화 성공!</p>
                    <p><strong>프로젝트 ID:</strong> ${app.options.projectId}</p>
                    <p><strong>인증 도메인:</strong> ${app.options.authDomain}</p>
                    <button onclick="checkLoginStatus()" style="margin-top: 10px;">
                        로그인 상태 확인
                    </button>
                `;
                
            } catch (error) {
                document.getElementById('firebase-result').innerHTML = 
                    `<p style="color:red">❌ Firebase 초기화 실패: ${error.message}</p>`;
            }
        }
        
        function checkLoginStatus() {
            const auth = firebase.auth();
            auth.onAuthStateChanged(user => {
                const resultDiv = document.getElementById('firebase-result');
                if (user) {
                    resultDiv.innerHTML += `
                        <p style="color:green">✅ 로그인됨: ${user.email}</p>
                        <p>UID: ${user.uid}</p>
                        <button onclick="goToMainAdmin()">관리자 페이지 이동</button>
                    `;
                } else {
                    resultDiv.innerHTML += `
                        <p style="color:orange">⚠️ 로그인되지 않음</p>
                        <p><a href="https://${window.location.hostname.split('.')[0]}.github.io/login/">
                            로그인 페이지로 이동
                        </a></p>
                    `;
                }
            });
        }
        
        function goToMainAdmin() {
            window.location.href = window.location.href.replace('test.html', 'index.html');
        }
    </script>
</body>
</html>
